name: Kokoro Short Narration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kokoro-short-narration.yml"

permissions:
  contents: read

jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kokoro
        run: |
          python -m pip install --upgrade pip
          pip install "kokoro-onnx==0.6.1" "soundfile>=0.13"

      - name: Download Kokoro model
        run: |
          curl -L --fail --retry 3             https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx             -o kokoro-v1.0.onnx
          curl -L --fail --retry 3             https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin             -o voices-v1.0.bin

      - name: Synthesize approved male narration
        run: |
          cat > synth.py <<'PY'
          import json
          import soundfile as sf
          from kokoro_onnx import Kokoro

          text = (
              "Six apps. Twenty-nine tool calls. "
              "Only two of eight checks passed. "
              "CRM and Calendar worked. "
              "Calendly, Zoom, DocuSign, and the proposal failed. "
              "A tool call is not a workflow."
          )

          kokoro = Kokoro("kokoro-v1.0.onnx", "voices-v1.0.bin")
          samples, sample_rate = kokoro.create(
              text,
              voice="am_michael",
              speed=1.10,
              lang="en-us",
          )

          sf.write("narration.wav", samples, sample_rate, subtype="PCM_16")

          duration = len(samples) / sample_rate
          with open("narration_meta.json", "w", encoding="utf-8") as f:
              json.dump({
                  "engine": "Kokoro v1.0 ONNX",
                  "voice": "am_michael",
                  "speed": 1.10,
                  "language": "en-us",
                  "sample_rate": sample_rate,
                  "duration_seconds": duration,
                  "script": text,
              }, f, indent=2)

          print(f"duration_seconds={duration:.3f}")
          PY
          python synth.py

      - name: Upload narration artifact
        uses: actions/upload-artifact@v4
        with:
          name: kokoro-short-2026-10-02
          path: |
            narration.wav
            narration_meta.json
          retention-days: 3
